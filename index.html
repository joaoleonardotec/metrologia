<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrologia & Certificados - Portal Corporativo</title>
    <style>
        :root {
            --primary-purple: #5b3cf5;
            --primary-purple-hover: #482cd4;
            --light-purple: #f0ecff;
            --sidebar-bg: #1a202c;
            --sidebar-hover: #2d3748;
            --main-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        aside {
            width: 300px;
            background-color: var(--sidebar-bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .sidebar-brand {
            padding: 20px 15px;
            background-color: #141923;
            border-bottom: 1px solid #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .sidebar-brand img {
            width: 100%;
            height: auto;
            max-height: 220px;
            object-fit: contain;
        }

        .sidebar-menu {
            list-style: none;
            padding: 15px 0;
            flex-grow: 1;
            overflow-y: auto;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 22px;
            color: #a0aec0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .sidebar-menu a:hover, .sidebar-menu li.active a {
            background-color: var(--sidebar-hover);
            color: #fff;
            border-left: 5px solid var(--primary-purple);
        }

        /* MAIN CONTENT */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        header {
            background-color: var(--card-bg);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .content-body {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block !important;
        }

        /* FORMULÁRIO ESTILO ARKMEDS */
        .section-header-banner {
            background-color: var(--primary-purple);
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px 6px 0 0;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .section-box {
            background: #fff;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 6px 6px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .form-field label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-field input, .form-field select, .form-field textarea {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 3px rgba(91, 60, 245, 0.1);
        }

        .sub-info {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* BOTÕES ESTILO ARKMEDS */
        .btn-purple {
            background-color: var(--primary-purple);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-purple:hover {
            background-color: var(--primary-purple-hover);
        }

        .btn-outline-purple {
            background: transparent;
            color: var(--primary-purple);
            border: 1.5px solid var(--primary-purple);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-outline-purple:hover {
            background-color: var(--light-purple);
        }

        /* ESTRUTURA DE FAIXAS & MEDIÇÕES */
        .faixa-container {
            border: 1px dashed var(--primary-purple);
            border-radius: 8px;
            padding: 20px;
            background-color: #fafafa;
            margin-top: 15px;
        }

        .faixa-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 600;
            color: #1e293b;
        }

        .grid-medicoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .box-medicoes, .box-resultados {
            background-color: #e0d7ff;
            border-radius: 12px;
            padding: 20px;
        }

        .box-title {
            text-align: center;
            font-weight: 600;
            color: #334155;
            margin-bottom: 15px;
        }

        .medicao-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .medicao-row input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        /* TABELAS GERAIS */
        .card-table {
            background-color: #fff;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        th { background-color: #f8fafc; color: #475569; }

        .badge-success {
            background-color: #dcfce7;
            color: #166534;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
        }
    </style>
</head>

        </div>
        <ul class="sidebar-menu">

            <li class="menu-item"><a href="javascript:void(0)" onclick="switchTab('certificados', this.parentElement)">📜 Certificados Emitidos</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="switchTab('clientes', this.parentElement)">🏢 Clientes & Empresas</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="switchTab('configuracoes', this.parentElement)">⚙️ Configurações</a></li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main>
        <header>
            <div style="display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:0.85rem;">
                🏠 Dashboard &gt; Instrumentos &gt; <strong style="color:var(--primary-purple);" id="breadcrumb-title">Cadastrar Instrumento</strong>
            </div>
            <div style="font-weight:600; font-size:0.9rem;">Laboratório Central</div>
        </header>

            <div id="dashboard" class="tab-content">
                <h2 style="margin-bottom:20px;">Painel Geral de Metrologia</h2>
